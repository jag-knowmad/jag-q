<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Studio — make an AR postcard</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    #preview-wrap { display: none; position: relative; margin-top: 14px; width: 480px; max-width: 100%; }
    #preview { width: 100%; border-radius: 12px; display: block; }
    #horizon-line {
      position: absolute; left: 0; right: 0; top: 40%;
      height: 0; border-top: 2px dashed var(--accent-2);
      cursor: ns-resize;
    }
    #horizon-line::after {
      content: "drag to the horizon"; position: absolute; right: 6px; top: 4px;
      font-size: 0.72rem; color: var(--accent-2); background: rgba(0,0,0,0.4);
      padding: 2px 6px; border-radius: 6px;
    }
    #progress, #output { display: none; margin-top: 18px; }
    a.btn { text-decoration: none; display: inline-block; }
  </style>
  <script src="js/cards.js"></script>
</head>
<body>
  <div class="wrap">
    <div class="brand"><a href="index.html" style="text-decoration:none;color:inherit">AR Postcards</a> · Studio</div>
    <h1 class="hero">Make a new AR postcard</h1>
    <p class="lead">Pick a photo, mark the horizon, and compile a tracking marker right here in your browser. Everything stays on your device.</p>

    <div class="panel">
      <label for="file">1. Choose a photo</label>
      <input type="file" id="file" accept="image/*" />

      <div id="preview-wrap">
        <label>2. Drag the line to the treeline / horizon — clouds animate above it</label>
        <canvas id="preview"></canvas>
        <div id="horizon-line"></div>
      </div>

      <div class="row" style="margin-top:8px">
        <div style="flex:1;min-width:180px">
          <label for="card-title">3. Title</label>
          <input type="text" id="card-title" placeholder="My postcard" />
        </div>
        <div style="flex:1;min-width:180px">
          <label for="card-id">Card id (used in the URL)</label>
          <input type="text" id="card-id" placeholder="auto from title" />
        </div>
      </div>

      <div style="margin-top:18px">
        <button class="btn" id="compile" disabled>Compile marker</button>
      </div>

      <div id="progress" class="url-box"></div>
      <div id="output"></div>
    </div>

    <div class="footer">
      Prefer the command line? Run <code>npm run add-card -- path/to/photo.jpg my-card-id</code> locally.
    </div>
  </div>

  <script src="lib/studio-compiler.js"></script>
  <script src="js/studio.js"></script>
</body>
</html>
